# Pipeline para Deploy Profissional - Portal de Consulta Previdenciária
# Este arquivo automatiza a publicação do sistema no GitLab Pages, gerando o link seguro (HTTPS) para o setor de TI.

image: alpine:latest

pages:
  stage: deploy
  script:
    - mv wwwroot public
    - cp public/portal.html public/index.html
  artifacts:
    paths:
      - public
  only:
    - main
    - master
    - v2-portal

# Recomendações de Segurança para o Setor de TI:
# 1. URL Oficial: Solicitar ao TI o mapeamento de um domínio próprio (ex: consulta.diretoria.gov.br).
# 2. CORS no Supabase: Ativar restrição de domínio no Dashboard do Supabase para aceitar apenas a URL oficial.
# 3. HTTPS: O GitLab Pages já fornece HTTPS por padrão, garantindo a criptografia dos dados.
